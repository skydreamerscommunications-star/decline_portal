<!-- index.html - Frontend Interface -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Declined Leads Submission Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        input:focus, select:focus { outline: none; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">
    <div class="container mx-auto px-4 py-12 max-w-2xl">
        <div class="text-center mb-10">
            <h1 class="text-3xl font-bold text-slate-800 mb-2">Declined Leads Submission</h1>
            <p class="text-slate-600">Submit declined leads to tracking system</p>
        </div>

        <div class="bg-white rounded-2xl shadow-lg border border-slate-200 p-8">
            <form id="declinedForm" class="space-y-6">
                <!-- Row 1: Phone & State -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Phone Field -->
                    <div>
                        <label for="phone" class="block text-sm font-medium text-slate-700 mb-2">
                            Phone Number *
                        </label>
                        <div class="relative">
                            <div class="absolute left-3 top-3.5">
                                <i id="phoneIcon" class="fas fa-phone text-slate-400"></i>
                            </div>
                            <input 
                                type="tel" 
                                id="phone" 
                                name="phone"
                                required
                                placeholder="1234567890"
                                class="w-full pl-10 pr-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
                            >
                        </div>
                        <p class="mt-1 text-xs text-slate-500">10 digits required</p>
                    </div>

                    <!-- State Field -->
                    <div>
                        <label for="state" class="block text-sm font-medium text-slate-700 mb-2">
                            State *
                        </label>
                        <div class="relative">
                            <div class="absolute left-3 top-3.5">
                                <i id="stateIcon" class="fas fa-map-marker-alt text-slate-400"></i>
                            </div>
                            <select 
                                id="state" 
                                name="state"
                                required
                                class="w-full pl-10 pr-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition bg-white appearance-none"
                            >
                                <option value="" disabled selected>Select state</option>
                            </select>
                            <div class="absolute right-3 top-3.5 pointer-events-none">
                                <i class="fas fa-chevron-down text-slate-400"></i>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Row 2: DID Match (Full Width) -->
                <div>
                    <label for="match" class="block text-sm font-medium text-slate-700 mb-2">
                        DID Match *
                    </label>
                    <div class="relative">
                        <div class="absolute left-3 top-3.5">
                            <i id="matchIcon" class="fas fa-link text-slate-400"></i>
                        </div>
                        <input 
                            type="text" 
                            id="match" 
                            name="match"
                            required
                            placeholder="D1 CPL, D2 CPA, etc."
                            class="w-full pl-10 pr-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
                        >
                    </div>
                </div>

                <!-- Row 3: Drop Reason (Now Mandatory) -->
                <div>
                    <label for="reason" class="block text-sm font-medium text-slate-700 mb-2">
                        Drop Reason *
                    </label>
                    <div class="relative">
                        <div class="absolute left-3 top-3.5">
                            <i id="reasonIcon" class="fas fa-comment-alt text-slate-400"></i>
                        </div>
                        <input 
                            type="text" 
                            id="reason" 
                            name="reason"
                            required
                            placeholder="Pickup Issue, Wrong Number, etc."
                            class="w-full pl-10 pr-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
                        >
                    </div>
                </div>

                <!-- Row 4: Agent (Full Width) -->
                <div>
                    <label for="agent" class="block text-sm font-medium text-slate-700 mb-2">
                        Agent *
                    </label>
                    <div class="relative">
                        <div class="absolute left-3 top-3.5">
                            <i id="agentIcon" class="fas fa-user text-slate-400"></i>
                        </div>
                        <select 
                            id="agent" 
                            name="agent"
                            required
                            class="w-full pl-10 pr-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition bg-white appearance-none"
                        >
                            <option value="" disabled selected>Loading agents...</option>
                        </select>
                        <div class="absolute right-3 top-3.5 pointer-events-none">
                            <i class="fas fa-chevron-down text-slate-400"></i>
                        </div>
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="pt-4">
                    <button 
                        type="submit"
                        id="submitBtn"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3.5 px-6 rounded-xl transition duration-200 focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
                    >
                        Submit Declined Lead
                    </button>
                </div>

                <!-- Status Message -->
                <div id="statusMessage" class="text-center hidden mt-4 p-3 rounded-lg"></div>
            </form>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyBEM6b42D73gn0RMKnxAdIFDs0jolqu9srh3qtFZLOV1WUoswGirPUBjBMfa2zlNGD/exec";
        const STATES = [
            'AL','AK','AZ','AR','CA','CO','CT','DE','FL','GA',
            'HI','ID','IL','IN','IA','KS','KY','LA','ME','MD',
            'MA','MI','MN','MS','MO','MT','NE','NV','NH','NJ',
            'NM','NY','NC','ND','OH','OK','OR','PA','RI','SC',
            'SD','TN','TX','UT','VT','VA','WA','WV','WI','WY'
        ];

        document.addEventListener('DOMContentLoaded', () => {
            populateStateDropdown();
            fetchAgents();
            setupFieldValidation();
        });

        function populateStateDropdown() {
            const stateSelect = document.getElementById('state');
            stateSelect.innerHTML = '<option value="" disabled selected>Select state</option>';
            
            STATES.forEach(state => {
                const option = document.createElement('option');
                option.value = state;
                option.textContent = state;
                stateSelect.appendChild(option);
            });
        }

        async function fetchAgents() {
            const agentSelect = document.getElementById('agent');
            
            try {
                const response = await fetch(`${SCRIPT_URL}?action=agents`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const data = await response.json();
                
                if (data.agents && data.agents.length > 0) {
                    agentSelect.innerHTML = '<option value="" disabled selected>Select an agent</option>';
                    data.agents.forEach(agent => {
                        const option = document.createElement('option');
                        option.value = agent;
                        option.textContent = agent;
                        agentSelect.appendChild(option);
                    });
                } else {
                    agentSelect.innerHTML = '<option value="" disabled selected>No agents available</option>';
                }
            } catch (error) {
                console.error('Failed to load agents:', error);
                agentSelect.innerHTML = '<option value="" disabled selected>Failed to load agents</option>';
            }
        }

        function setupFieldValidation() {
            const phoneInput = document.getElementById('phone');
            const stateSelect = document.getElementById('state');
            const matchInput = document.getElementById('match');
            const reasonInput = document.getElementById('reason');
            const agentSelect = document.getElementById('agent');
            
            const phoneIcon = document.getElementById('phoneIcon');
            const stateIcon = document.getElementById('stateIcon');
            const matchIcon = document.getElementById('matchIcon');
            const reasonIcon = document.getElementById('reasonIcon');
            const agentIcon = document.getElementById('agentIcon');
            
            phoneInput.addEventListener('input', function() {
                this.value = this.value.replace(/\D/g, '');
                if (this.value.length === 10) {
                    phoneIcon.classList.remove('text-slate-400');
                    phoneIcon.classList.add('text-blue-600');
                } else {
                    phoneIcon.classList.remove('text-blue-600');
                    phoneIcon.classList.add('text-slate-400');
                }
            });
            
            stateSelect.addEventListener('change', function() {
                if (this.value) {
                    stateIcon.classList.remove('text-slate-400');
                    stateIcon.classList.add('text-blue-600');
                } else {
                    stateIcon.classList.remove('text-blue-600');
                    stateIcon.classList.add('text-slate-400');
                }
            });
            
            matchInput.addEventListener('input', function() {
                if (this.value.trim()) {
                    matchIcon.classList.remove('text-slate-400');
                    matchIcon.classList.add('text-blue-600');
                } else {
                    matchIcon.classList.remove('text-blue-600');
                    matchIcon.classList.add('text-slate-400');
                }
            });
            
            reasonInput.addEventListener('input', function() {
                if (this.value.trim()) {
                    reasonIcon.classList.remove('text-slate-400');
                    reasonIcon.classList.add('text-blue-600');
                } else {
                    reasonIcon.classList.remove('text-blue-600');
                    reasonIcon.classList.add('text-slate-400');
                }
            });
            
            agentSelect.addEventListener('change', function() {
                if (this.value) {
                    agentIcon.classList.remove('text-slate-400');
                    agentIcon.classList.add('text-blue-600');
                } else {
                    agentIcon.classList.remove('text-blue-600');
                    agentIcon.classList.add('text-slate-400');
                }
            });
        }

        document.getElementById('declinedForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const form = e.target;
            const submitBtn = document.getElementById('submitBtn');
            const statusDiv = document.getElementById('statusMessage');
            
            const formData = {
                phone: document.getElementById('phone').value.trim(),
                state: document.getElementById('state').value,
                match: document.getElementById('match').value.trim(),
                reason: document.getElementById('reason').value.trim(),
                agent: document.getElementById('agent').value
            };
            
            if (!formData.phone || !formData.state || !formData.match || !formData.reason || !formData.agent) {
                showStatus('Please fill all required fields', 'error');
                return;
            }
            
            if (formData.phone.length !== 10) {
                showStatus('Phone number must be 10 digits', 'error');
                return;
            }
            
            if (!formData.reason.trim()) {
                showStatus('Drop reason is required', 'error');
                return;
            }
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'Submitting...';
            submitBtn.classList.add('opacity-75');
            
            try {
                await fetch(SCRIPT_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(formData)
                });

                showStatus("✅ Lead submitted successfully!", "success");
                document.getElementById('phone').value = '';
                document.getElementById('match').value = '';
                document.getElementById('reason').value = '';
                document.getElementById('phone').focus();
                
                document.getElementById('phoneIcon').classList.remove('text-blue-600');
                document.getElementById('phoneIcon').classList.add('text-slate-400');
                document.getElementById('matchIcon').classList.remove('text-blue-600');
                document.getElementById('matchIcon').classList.add('text-slate-400');
                document.getElementById('reasonIcon').classList.remove('text-blue-600');
                document.getElementById('reasonIcon').classList.add('text-slate-400');
                
                setTimeout(() => {
                    statusDiv.classList.add('hidden');
                }, 3000);
                
            } catch (error) {
                showStatus('❌ Network error. Please try again.', 'error');
                console.error('Submission error:', error);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit Declined Lead';
                submitBtn.classList.remove('opacity-75');
            }
        });

        function showStatus(message, type) {
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.textContent = message;
            statusDiv.className = 'text-center mt-4 p-3 rounded-lg hidden';
            
            if (type === 'success') {
                statusDiv.classList.add('bg-emerald-50', 'text-emerald-700', 'border', 'border-emerald-200');
            } else {
                statusDiv.classList.add('bg-red-50', 'text-red-700', 'border', 'border-red-200');
            }
            
            statusDiv.classList.remove('hidden');
        }
    </script>
</body>
</html>
